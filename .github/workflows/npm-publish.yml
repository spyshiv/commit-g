name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Publish with trusted publishing
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          # setup-node writes a placeholder token that blocks the OIDC exchange.
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "GitHub did not provide an OIDC token request URL."
            exit 1
          fi
          env -u NODE_AUTH_TOKEN npm publish --loglevel verbose
